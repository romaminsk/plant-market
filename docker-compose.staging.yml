name: plant-market-staging

# Overlay: docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging up
# Secrets are files under infra/staging/secrets; the Java entrypoint exports them.

secrets:
  JWT_SECRET:
    file: ./infra/staging/secrets/jwt_secret.txt
  POSTGRES_PASSWORD:
    file: ./infra/staging/secrets/postgres_password.txt
  PAYMENT_WEBHOOK_SECRET:
    file: ./infra/staging/secrets/payment_webhook_secret.txt

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    # The base file sets a compose placeholder; the official entrypoint rejects both forms.
    entrypoint: ['/bin/sh', '-c', 'unset POSTGRES_PASSWORD; exec docker-entrypoint.sh postgres']
    secrets:
      - POSTGRES_PASSWORD

  auth-service:
    environment:
      APP_ENV: staging
      JWT_ISSUER: https://${STAGING_DOMAIN}
      SESSION_COOKIE_NAME: __Host-PM-SESSION
      SESSION_COOKIE_SECURE: 'true'
      AUTH_STOREFRONT_REDIRECT_URIS: https://${STAGING_DOMAIN}/auth/callback
      AUTH_ADMIN_REDIRECT_URIS: https://admin.${STAGING_DOMAIN}/auth/callback
    secrets:
      - JWT_SECRET
      - POSTGRES_PASSWORD

  catalog-service:
    environment:
      APP_ENV: staging
      MEDIA_STORAGE: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: plant-market-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MEDIA_PUBLIC_BASE_URL: https://${STAGING_DOMAIN}/media
    secrets:
      - JWT_SECRET
      - POSTGRES_PASSWORD

  order-service:
    environment:
      APP_ENV: staging
    secrets:
      - JWT_SECRET
      - POSTGRES_PASSWORD

  payment-service:
    environment:
      APP_ENV: staging
    secrets:
      - JWT_SECRET
      - POSTGRES_PASSWORD
      - PAYMENT_WEBHOOK_SECRET

  api-gateway:
    environment:
      APP_ENV: staging
      CORS_ALLOWED_ORIGINS: https://${STAGING_DOMAIN},https://admin.${STAGING_DOMAIN}
    secrets:
      - JWT_SECRET

  storefront:
    build:
      context: .
      dockerfile: clients/storefront/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${STAGING_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${STAGING_DOMAIN}
        AUTH_SERVICE_URL: https://${STAGING_DOMAIN}
    environment:
      API_URL: http://api-gateway:8080
      AUTH_SERVICE_URL: http://api-gateway:8080
      AUTH_PUBLIC_URL: https://${STAGING_DOMAIN}
      COOKIE_SECURE: 'true'
    depends_on:
      api-gateway:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: clients/admin/Dockerfile
      args:
        VITE_API_URL: https://${STAGING_DOMAIN}

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - seaweedfs-data:/data
      - ./infra/staging/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://plant-market-media || true
        sleep infinity
    healthcheck:
      test: ['CMD', 'true']
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      STAGING_TLS_VALUE: ${STAGING_TLS_VALUE}
    volumes:
      - ./infra/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storefront
      - admin
      - api-gateway
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  seaweedfs-data:
  caddy-data:
  caddy-config:
