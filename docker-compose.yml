# Phase 0 local infrastructure. MinIO is intentionally absent until Phase 3 (ADR-0003).
name: plant-market

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - '127.0.0.1:${WIREMOCK_PORT:-8089}:8080'
    volumes:
      - ./infra/wiremock:/home/wiremock
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/__admin/health >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTH_SERVICE_PORT: 8090
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT10M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-PM-SESSION}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CATALOG_SERVICE_PORT: 8081
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MEDIA_ROOT: /app/data/media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080/media
    volumes:
      - media-data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ORDER_SERVICE_PORT: 8083
      CATALOG_SERVICE_URI: http://catalog-service:8081
      PAYMENT_SERVICE_URI: http://payment-service:8084
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      MAIL_SMTP_CONNECTION_TIMEOUT_MS: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_SMTP_READ_TIMEOUT_MS: ${MAIL_SMTP_READ_TIMEOUT_MS:-5000}
      MAIL_SMTP_WRITE_TIMEOUT_MS: ${MAIL_SMTP_WRITE_TIMEOUT_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PAYMENT_SERVICE_PORT: 8084
      PAYMENT_PROVIDER_URI: http://wiremock:8080
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}
      PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8084'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      API_GATEWAY_PORT: 8080
      AUTH_SERVICE_URI: http://auth-service:8090
      CATALOG_SERVICE_URI: http://catalog-service:8081
      ORDER_SERVICE_URI: http://order-service:8083
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3100,http://localhost:5173}'
      RATE_LIMIT_PUBLIC_RPM: ${RATE_LIMIT_PUBLIC_RPM:-2000}
      RATE_LIMIT_AUTH_RPM: ${RATE_LIMIT_AUTH_RPM:-100}
      RATE_LIMIT_AUTHENTICATED_RPM: ${RATE_LIMIT_AUTHENTICATED_RPM:-300}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
      SPRING_DATA_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
    ports:
      - '127.0.0.1:${API_GATEWAY_PORT:-8080}:8080'
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  media-data:
  postgres-data:
