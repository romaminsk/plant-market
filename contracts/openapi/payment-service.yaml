openapi: 3.1.0
info:
  title: Plant Market — Payment Service
  version: 0.1.0
  description: |
    Phase 2 sandbox payment API. The service calls the provider through WireMock and accepts
    provider webhooks. All errors use RFC 7807 `application/problem+json`.
servers:
  - url: http://localhost:8084
    description: Internal service (local)

tags:
  - name: payments

paths:
  /api/v1/payments:
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment through the sandbox provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Provider rejected the payment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPayment
      tags: [payments]
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/webhook:
    post:
      operationId: paymentWebhook
      tags: [payments]
      summary: Provider callback; HMAC-SHA256 signed and replay-protected
      description: |
        The signature is hex HMAC-SHA256 over `timestamp + "\n" + eventId + "\n" + rawBody`,
        using `PAYMENT_WEBHOOK_SECRET`. Timestamps outside the configured tolerance
        (`PAYMENT_WEBHOOK_TOLERANCE_SECONDS`, default 300) are rejected. A repeated
        `X-Provider-Event-Id` is acknowledged idempotently without applying the transition again.
      parameters:
        - name: X-Provider-Timestamp
          in: header
          required: true
          description: Epoch seconds, included in the signature.
          schema:
            type: string
            pattern: '^[0-9]+$'
        - name: X-Provider-Event-Id
          in: header
          required: true
          description: Unique provider event id, max 128 chars.
          schema:
            type: string
            maxLength: 128
        - name: X-Provider-Signature
          in: header
          required: true
          description: Lowercase or uppercase hex HMAC-SHA256.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Updated payment (or current payment for a duplicate event)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid signature or timestamp outside the allowed tolerance
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Illegal payment status transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Payment not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [orderId, amountMinor, currency]
      properties:
        orderId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          enum: [BYN]

    PaymentWebhookRequest:
      type: object
      additionalProperties: false
      required: [providerRef, status]
      properties:
        providerRef:
          type: string
        status:
          type: string
          enum: [AUTHORIZED, CONFIRMED, PENDING, FAILED, REFUNDED]

    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, CONFIRMED, FAILED, REFUNDED]

    Payment:
      type: object
      additionalProperties: false
      required: [id, orderId, amountMinor, currency, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          enum: [BYN]
        status:
          $ref: '#/components/schemas/PaymentStatus'
        providerRef:
          type: string
        redirectUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
