openapi: 3.1.0
info:
  title: Plant Market — Catalog Service
  version: 0.1.0
  description: |
    Phase 0 catalog API: categories and products with pagination and filters.
    Phase 1 adds ProductVariant and IndividualPlant; Phase 0 uses a flat product price
    as a deliberate simplification.
servers:
  - url: http://localhost:8081
    description: Direct service (local)
  - url: http://localhost:8080
    description: Through api-gateway (local)

tags:
  - name: categories
  - name: products
  - name: variants
  - name: individual-plants
  - name: stock-batches
  - name: restock
  - name: media

paths:
  /api/v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Slug already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a category by id
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete an empty category
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Category contains products
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with pagination and filters
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProductStatus'
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: SKU or slug already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by id
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Archive a product
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Archived
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: listVariants
      tags: [variants]
      summary: List product variants
      responses:
        '200':
          description: Variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variant'
    post:
      operationId: createVariant
      tags: [variants]
      summary: Create a product variant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: SKU already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/variants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getVariant
      tags: [variants]
      responses:
        '200':
          description: Variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateVariant
      tags: [variants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveVariant
      tags: [variants]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Archived
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/individual-plants:
    get:
      operationId: listIndividualPlants
      tags: [individual-plants]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IndividualPlantStatus'
        - name: light
          in: query
          schema:
            $ref: '#/components/schemas/LightLevel'
        - name: variegated
          in: query
          schema:
            type: boolean
        - name: maxPriceMinor
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Page of individual plants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageIndividualPlant'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/products/{productId}/individual-plants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: createIndividualPlant
      tags: [individual-plants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualPlantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualPlant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Plant code already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/individual-plants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getIndividualPlant
      tags: [individual-plants]
      responses:
        '200':
          description: Individual plant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualPlant'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateIndividualPlant
      tags: [individual-plants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualPlantRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualPlant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/individual-plants/{id}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateIndividualPlantPhotos
      tags: [individual-plants]
      summary: Replace the WYSIWYG photo gallery of an individual plant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantPhotosRequest'
      responses:
        '200':
          description: Photos replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualPlant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/individual-plants/{id}/transitions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: transitionIndividualPlant
      tags: [individual-plants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantTransitionRequest'
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualPlant'
        '409':
          description: Illegal state transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/stock-batches:
    get:
      operationId: listStockBatches
      tags: [stock-batches]
      security:
        - bearerAuth: []
      parameters:
        - name: variantId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stock batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockBatch'
    post:
      operationId: createStockBatch
      tags: [stock-batches]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockBatchRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBatch'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/stock-batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStockBatch
      tags: [stock-batches]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stock batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBatch'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/stock-batches/{id}/release:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: releaseStockBatch
      tags: [stock-batches]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBatch'
        '409':
          description: Batch is not in quarantine
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/stock-batches/{id}/adjust:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: adjustStockBatch
      tags: [stock-batches]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBatch'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/restock-subscriptions:
    post:
      operationId: subscribeToRestock
      tags: [restock]
      summary: Subscribe an email to a sold-out variant or individual plant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestockSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockSubscription'
        '200':
          description: Subscription already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Target is already in stock
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/restock-subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRestockSubscription
      tags: [restock]
      summary: Get a restock subscription status
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockSubscription'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a JPEG, PNG or WebP image (max 10 MB)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored image URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Format: field,asc|desc. Allowed: name, priceMinor, createdAt.'
      schema:
        type: string
        default: createdAt,desc
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Category:
      type: object
      additionalProperties: false
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 120
        description:
          type: string
          maxLength: 2000

    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    CareLevel:
      type: string
      enum: [EASY, MEDIUM, HARD]

    LightLevel:
      type: string
      enum: [LOW, MEDIUM, BRIGHT, DIRECT]

    Product:
      type: object
      additionalProperties: false
      required:
        [
          id,
          sku,
          name,
          slug,
          categoryId,
          priceMinor,
          currency,
          status,
          careLevel,
          light,
          petSafe,
          variegated,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          description: Price in minor units (kopecks for BYN).
        currency:
          type: string
          enum: [BYN]
        status:
          $ref: '#/components/schemas/ProductStatus'
        careLevel:
          $ref: '#/components/schemas/CareLevel'
        light:
          $ref: '#/components/schemas/LightLevel'
        petSafe:
          type: boolean
        variegated:
          type: boolean
        size:
          type: string
          maxLength: 32
        careGuide:
          type: string
          maxLength: 5000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductRequest:
      type: object
      additionalProperties: false
      required:
        [sku, name, slug, categoryId, priceMinor, currency, status, careLevel, light, petSafe]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [BYN]
        status:
          $ref: '#/components/schemas/ProductStatus'
        careLevel:
          $ref: '#/components/schemas/CareLevel'
        light:
          $ref: '#/components/schemas/LightLevel'
        petSafe:
          type: boolean
        variegated:
          type: boolean
        size:
          type: string
          maxLength: 32
        careGuide:
          type: string
          maxLength: 5000

    PageProduct:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    VariantStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    MediaResponse:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri

    RestockTargetType:
      type: string
      enum: [VARIANT, INDIVIDUAL_PLANT]

    RestockSubscriptionStatus:
      type: string
      enum: [PENDING, NOTIFIED]

    RestockSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, email]
      properties:
        targetType:
          $ref: '#/components/schemas/RestockTargetType'
        targetId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254

    RestockSubscription:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/RestockTargetType'
        targetId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RestockSubscriptionStatus'
        createdAt:
          type: string
          format: date-time
        notifiedAt:
          type: string
          format: date-time

    VariantRequest:
      type: object
      additionalProperties: false
      required: [sku, name, priceMinor, currency, status]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        size:
          type: string
          maxLength: 32
        potSize:
          type: string
          maxLength: 32
        form:
          type: string
          maxLength: 32
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [BYN]
        status:
          $ref: '#/components/schemas/VariantStatus'

    Variant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          productId,
          sku,
          name,
          priceMinor,
          currency,
          status,
          availableQuantity,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        size:
          type: string
        potSize:
          type: string
        form:
          type: string
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [BYN]
        status:
          $ref: '#/components/schemas/VariantStatus'
        availableQuantity:
          type: integer
          minimum: 0
        createdAt:
