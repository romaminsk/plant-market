openapi: 3.1.0
info:
  title: Plant Market — Order Service
  version: 0.1.0
  description: |
    Phase 2 order API: draft order, checkout with stock reservation, stub payment and cancellation.
    All errors use RFC 7807 `application/problem+json`.
servers:
  - url: http://localhost:8083
    description: Direct service (local)
  - url: http://localhost:8080
    description: Through api-gateway (local)

tags:
  - name: orders

paths:
  /api/v1/orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a draft order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the current customer's orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orders/{id}/checkout:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: checkoutOrder
      tags: [orders]
      summary: Reserve stock and move the order to PENDING_PAYMENT
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order with reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Stock cannot be reserved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/orders/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: payOrder
      tags: [orders]
      summary: Confirm reservation and mark the order paid (Phase 2 stub)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Invalid order state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel a draft or pending-payment order and release stock
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Order cannot be cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Order not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'

    CreateOrderItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        variantId:
          type: string
          format: uuid
        individualPlantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    OrderItem:
      type: object
      additionalProperties: false
      required: [id, itemType, targetId, name, unitPriceMinor, quantity, lineTotalMinor]
      properties:
        id:
          type: string
          format: uuid
        itemType:
          type: string
          enum: [VARIANT, INDIVIDUAL_PLANT]
        targetId:
          type: string
          format: uuid
        name:
          type: string
        unitPriceMinor:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        lineTotalMinor:
          type: integer
          format: int64
          minimum: 0

    OrderStatus:
      type: string
      enum:
        [DRAFT, PENDING_PAYMENT, PAID, FULFILLING, SHIPPED, DELIVERED, COMPLETED, CANCELLED, FAILED]

    Order:
      type: object
      additionalProperties: false
      required:
        [id, customerId, status, subtotalMinor, shippingMinor, taxMinor, discountMinor, totalMinor, currency, items, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        subtotalMinor:
          type: integer
          format: int64
          minimum: 0
        shippingMinor:
          type: integer
          format: int64
          minimum: 0
        taxMinor:
          type: integer
          format: int64
          minimum: 0
        discountMinor:
          type: integer
          format: int64
          minimum: 0
        totalMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [BYN]
        reservationExpiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
