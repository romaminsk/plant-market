openapi: 3.1.0
info:
  title: Plant Market — Order Service
  version: 0.1.0
  description: |
    Phase 2 order API: draft order, checkout with stock reservation, stub payment and cancellation.
    All errors use RFC 7807 `application/problem+json`.
servers:
  - url: http://localhost:8083
    description: Direct service (local)
  - url: http://localhost:8080
    description: Through api-gateway (local)

tags:
  - name: orders
  - name: claims

paths:
  /api/v1/orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a draft order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the current customer's orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orders/{id}/checkout:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: checkoutOrder
      tags: [orders]
      summary: Reserve stock and move the order to PENDING_PAYMENT
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Order with reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Stock cannot be reserved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/orders/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: payOrder
      tags: [orders]
      summary: Confirm reservation and mark the order paid (Phase 2 stub)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Invalid order state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel a draft or pending-payment order and release stock
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Order cannot be cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/orders/{orderId}/claims:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: openClaim
      tags: [claims]
      summary: Open a damaged plant claim for a paid order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Claims are only allowed for paid orders
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listOrderClaims
      tags: [claims]
      summary: List claims for an order of the current customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims (staff)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, REPLACEMENT, REFUND, REJECTED]
      responses:
        '200':
          description: Claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimResponse'

  /api/v1/claims/{id}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getClaim
      tags: [claims]
      summary: Get a claim (staff)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: decideClaim
      tags: [claims]
      summary: Decide an open claim (staff)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDecisionRequest'
      responses:
        '200':
          description: Decided claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Claim is already decided
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/shipping/zones:
    get:
      operationId: listShippingZones
      tags: [shipping]
      summary: List active delivery zones
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingZone'
    post:
      operationId: createShippingZone
      tags: [shipping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingZoneRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingZone'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/shipping/zones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getShippingZone
      tags: [shipping]
      responses:
        '200':
          description: Zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingZone'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateShippingZone
      tags: [shipping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingZoneRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingZone'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/orders/{orderId}/care-reminders:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createCareReminders
      tags: [care]
      summary: Opt in to care reminders for every item of a paid order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareReminderRequest'
      responses:
        '201':
          description: Active reminders (idempotent for an order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareReminder'
        '409':
          description: Order is not paid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listOrderCareReminders
      tags: [care]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active reminders of the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareReminder'

  /api/v1/care-reminders:
    get:
      operationId: listCareReminders
      tags: [care]
      summary: List all reminders of the current customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareReminder'

  /api/v1/care-reminders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deactivateCareReminder
      tags: [care]
      summary: Opt out of a care reminder
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Reminder deactivated
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Order not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'

    CreateOrderItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        variantId:
          type: string
          format: uuid
        individualPlantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    OrderItem:
      type: object
      additionalProperties: false
      required: [id, itemType, targetId, name, unitPriceMinor, quantity, lineTotalMinor]
      properties:
        id:
          type: string
          format: uuid
        itemType:
          type: string
          enum: [VARIANT, INDIVIDUAL_PLANT]
        targetId:
          type: string
          format: uuid
        name:
          type: string
        unitPriceMinor:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        lineTotalMinor:
          type: integer
          format: int64
          minimum: 0

    OrderStatus:
      type: string
      enum:
        [DRAFT, PENDING_PAYMENT, PAID, FULFILLING, SHIPPED, DELIVERED, COMPLETED, CANCELLED, FAILED]

    Order:
      type: object
      additionalProperties: false
      required:
        [
          id,
          customerId,
          status,
          subtotalMinor,
          shippingMinor,
          taxMinor,
          discountMinor,
          totalMinor,
          currency,
          items,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        customerEmail:
          type: string
        shippingZoneId:
          type: string
          format: uuid
        thermalPack:
          type: boolean
        status:
          $ref: '#/components/schemas/OrderStatus'
        subtotalMinor:
          type: integer
          format: int64
          minimum: 0
        shippingMinor:
          type: integer
          format: int64
          minimum: 0
        taxMinor:
          type: integer
          format: int64
          minimum: 0
        discountMinor:
          type: integer
          format: int64
          minimum: 0
        totalMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [BYN]
        reservationExpiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        shippingZoneId:
          type: string
          format: uuid
        thermalPack:
          type: boolean

    ShippingZoneRequest:
      type: object
      additionalProperties: false
      required:
        [
          name,
          city,
          priceMinor,
          freeFromMinor,
          minDays,
          maxDays,
          winterRequiresThermal,
          thermalPackMinor,
        ]
      properties:
        name:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        freeFromMinor:
          type: integer
          format: int64
          minimum: 0
        minDays:
          type: integer
          minimum: 0
        maxDays:
          type: integer
          minimum: 0
        winterRequiresThermal:
          type: boolean
        thermalPackMinor:
          type: integer
          format: int64
          minimum: 0
        active:
          type: boolean

    ShippingZone:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          city,
          priceMinor,
          freeFromMinor,
          minDays,
          maxDays,
          winterRequiresThermal,
          thermalPackMinor,
          active,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        priceMinor:
          type: integer
          format: int64
        freeFromMinor:
          type: integer
          format: int64
        minDays:
          type: integer
        maxDays:
          type: integer
        winterRequiresThermal:
          type: boolean
        thermalPackMinor:
          type: integer
          format: int64
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClaimRequest:
      type: object
      additionalProperties: false
      required: [reason, photoUrls]
      properties:
        reason:
          type: string
          maxLength: 2000
        photoUrls:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            maxLength: 1000

    ClaimDecision:
      type: string
      enum: [REPLACEMENT, REFUND, REJECT]

    ClaimDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/ClaimDecision'
        comment:
          type: string
          maxLength: 2000

    ClaimResponse:
      type: object
      additionalProperties: false
      required: [id, orderId, customerId, status, reason, photoUrls, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, REPLACEMENT, REFUND, REJECTED]
        reason:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        decisionComment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time

    CareReminderRequest:
      type: object
      additionalProperties: false
      required: [intervalDays]
      properties:
        intervalDays:
          type: integer
          minimum: 1
          maximum: 365

    CareReminder:
      type: object
      additionalProperties: false
      required: [id, orderId, orderItemId, plantName, intervalDays, nextSendAt, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        orderItemId:
          type: string
          format: uuid
        plantName:
          type: string
        intervalDays:
          type: integer
        nextSendAt:
          type: string
          format: date-time
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
