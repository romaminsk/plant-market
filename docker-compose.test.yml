# CI/throwaway override: no host ports, no persistent data.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait
name: plant-market-test

services:
  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantmarket}
      POSTGRES_DB: postgres

  wiremock:
    ports: !reset []

  mailhog:
    ports: !reset []
