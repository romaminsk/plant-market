# CI/throwaway override: no host ports for infrastructure or internal services,
# no persistent data. The gateway keeps its port so host-run E2E can reach it.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
name: plant-market-test

services:
  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantmarket}
      POSTGRES_DB: postgres

  wiremock:
    ports: !reset []

  mailhog:
    ports: !reset []

  auth-service:
    ports: !reset []

  catalog-service:
    ports: !reset []

  order-service:
    ports: !reset []

  payment-service:
    ports: !reset []
