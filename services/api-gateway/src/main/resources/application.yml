spring:
  application:
    name: api-gateway

server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-plant-market-jwt-secret-change-me-0123456789}
  gateway:
    auth-uri: ${AUTH_SERVICE_URI:http://localhost:8090}
    catalog-uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:100}
