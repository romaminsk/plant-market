spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Caddy is the TLS edge and already supplies X-Forwarded-*; don't overwrite them with http.
      x-forwarded:
        enabled: false
  data:
    redis:
      # Keep the limiter fast when Redis is unreachable; the store then falls back in-memory.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Compose already gates startup on the redis healthcheck; a Redis blip must not make the
      # whole gateway report DOWN.
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    environment: ${APP_ENV:prod}
  gateway:
    auth-uri: ${AUTH_SERVICE_URI:http://localhost:8090}
    catalog-uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
    order-uri: ${ORDER_SERVICE_URI:http://localhost:8083}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3100,http://localhost:5173}
  rate-limit:
    public-rpm: ${RATE_LIMIT_PUBLIC_RPM:60}
    auth-rpm: ${RATE_LIMIT_AUTH_RPM:10}
    authenticated-rpm: ${RATE_LIMIT_AUTHENTICATED_RPM:300}
    redis-url: ${RATE_LIMIT_REDIS_URL:}
    trust-forwarded: ${RATE_LIMIT_TRUST_FORWARDED:false}
