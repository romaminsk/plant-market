spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/pm_orders
    username: ${POSTGRES_USER:plantmarket}
    password: ${POSTGRES_PASSWORD:plantmarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${ORDER_SERVICE_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    environment: ${APP_ENV:prod}
  catalog:
    base-uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
  payment:
    base-uri: ${PAYMENT_SERVICE_URI:http://localhost:8084}
  orders:
    reservation-ttl: ${RESERVATION_TTL:PT15M}
  outbox:
    publish-ms: ${OUTBOX_PUBLISH_MS:5000}
