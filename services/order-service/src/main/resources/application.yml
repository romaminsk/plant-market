spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/pm_orders
    username: ${POSTGRES_USER:plantmarket}
    password: ${POSTGRES_PASSWORD:plantmarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${ORDER_SERVICE_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-plant-market-jwt-secret-change-me-0123456789}
  catalog:
    base-uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
  orders:
    reservation-ttl: ${RESERVATION_TTL:PT15M}
