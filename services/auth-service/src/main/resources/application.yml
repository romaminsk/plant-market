spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/pm_auth
    username: ${POSTGRES_USER:plantmarket}
    password: ${POSTGRES_PASSWORD:plantmarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${AUTH_SERVICE_PORT:8090}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:PM-SESSION}
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3100}
  session:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  auth:
    storefront-redirect-uris: ${AUTH_STOREFRONT_REDIRECT_URIS:http://localhost:3000/auth/callback,http://localhost:3100/auth/callback}
    admin-redirect-uris: ${AUTH_ADMIN_REDIRECT_URIS:http://localhost:5173/auth/callback}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8090}
    secret: ${JWT_SECRET}
    environment: ${APP_ENV:prod}
    access-ttl: ${JWT_ACCESS_TTL:PT10M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
