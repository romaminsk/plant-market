spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/pm_auth
    username: ${POSTGRES_USER:plantmarket}
    password: ${POSTGRES_PASSWORD:plantmarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${AUTH_SERVICE_PORT:8090}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:PM-SESSION}
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8090}
    secret: ${JWT_SECRET:dev-only-plant-market-jwt-secret-change-me-0123456789}
    access-ttl: ${JWT_ACCESS_TTL:PT10M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
