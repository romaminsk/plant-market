spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/pm_catalog
    username: ${POSTGRES_USER:plantmarket}
    password: ${POSTGRES_PASSWORD:plantmarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${CATALOG_SERVICE_PORT:8081}
  shutdown: graceful

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    environment: ${APP_ENV:prod}
  media:
    storage: ${MEDIA_STORAGE:filesystem}
    root: ${MEDIA_ROOT:./data/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8081/media}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:plant-market-media}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
